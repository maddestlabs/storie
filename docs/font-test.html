<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Font Test</title>
  <style>
    @font-face {
      font-family: '3270-regular';
      src: url('./assets/3270-regular-startup.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #222;
      color: #fff;
    }
    
    .test {
      margin: 20px 0;
      padding: 10px;
      background: #333;
    }
    
    .test-3270 {
      font-family: '3270-regular', monospace;
      font-size: 16px;
    }
    
    .test-default {
      font-family: monospace;
      font-size: 16px;
    }
    
    canvas {
      border: 1px solid #555;
      background: #000;
    }
  </style>
</head>
<body>
  <h1>Font Loading Test</h1>
  
  <div class="test">
    <h2>CSS Font Rendering:</h2>
    <p class="test-3270">The quick brown fox jumps over the lazy dog (3270-regular)</p>
    <p class="test-default">The quick brown fox jumps over the lazy dog (default monospace)</p>
  </div>
  
  <div class="test">
    <h2>Canvas Font Rendering:</h2>
    <canvas id="testCanvas" width="800" height="100"></canvas>
  </div>
  
  <div class="test">
    <h2>Font Metrics:</h2>
    <pre id="metrics"></pre>
  </div>
  
  <script>
    async function testFont() {
      // Wait for fonts
      await document.fonts.ready;
      
      // Try to explicitly load the font
      try {
        await document.fonts.load("16px '3270-regular'");
        console.log('✓ Font loaded via document.fonts.load()');
      } catch (e) {
        console.error('✗ Font load failed:', e);
      }
      
      // Check if font is available
      const fontAvailable = document.fonts.check("16px '3270-regular'");
      console.log('Font available:', fontAvailable);
      
      // Test canvas rendering
      const canvas = document.getElementById('testCanvas');
      const ctx = canvas.getContext('2d');
      
      // Clear canvas
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw with 3270 font
      ctx.font = "16px '3270-regular'";
      ctx.fillStyle = '#0f0';
      ctx.textBaseline = 'top';
      ctx.fillText('3270-regular: ABCDEFGHIJKLMNOPQRSTUVWXYZ 0123456789', 10, 10);
      
      // Draw with default monospace
      ctx.font = '16px monospace';
      ctx.fillStyle = '#ff0';
      ctx.fillText('monospace:    ABCDEFGHIJKLMNOPQRSTUVWXYZ 0123456789', 10, 40);
      
      // Measure and compare
      ctx.font = "16px '3270-regular'";
      const metrics3270 = ctx.measureText('M');
      
      ctx.font = '16px monospace';
      const metricsDefault = ctx.measureText('M');
      
      // Display results
      const metricsDiv = document.getElementById('metrics');
      metricsDiv.textContent = `
Font Check: ${fontAvailable ? '✓ Font is loaded' : '✗ Font not found'}

Canvas Font (3270-regular):
  ctx.font = "${ctx.font}"
  'M' width: ${metrics3270.width}px
  
Canvas Font (monospace):
  'M' width: ${metricsDefault.width}px
  
${metrics3270.width !== metricsDefault.width ? '✓ Fonts are DIFFERENT (custom font is working!)' : '✗ Fonts are SAME (custom font not working)'}
      `;
      
      console.log('3270 M width:', metrics3270.width);
      console.log('Default M width:', metricsDefault.width);
    }
    
    // Run test when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', testFont);
    } else {
      testFont();
    }
  </script>
</body>
</html>
