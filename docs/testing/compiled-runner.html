<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Storie Compiled Runner</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c1014;
        --fg: #e7ecef;
        --muted: #91a0ab;
        --panel: rgba(12, 16, 20, 0.86);
        --accent: #7ce0c3;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at top, #1a2730 0%, var(--bg) 55%);
        color: var(--fg);
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      #status {
        position: fixed;
        top: 16px;
        left: 16px;
        max-width: min(560px, calc(100vw - 32px));
        padding: 12px 14px;
        border: 1px solid rgba(124, 224, 195, 0.24);
        background: var(--panel);
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        z-index: 10;
      }

      #status strong {
        display: block;
        margin-bottom: 6px;
        color: var(--accent);
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #status p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <div id="status" role="status" aria-live="polite">
        <strong>Compiled Runner</strong>
        <p id="status-text">Loading compiled app…</p>
      </div>
    </div>
    <script type="module" src="./compiled-runner.js"></script>
  </body>
</html>
