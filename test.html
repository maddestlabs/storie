<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TStorie JS - Simple Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    
    h1 {
      margin-bottom: 0.5rem;
      font-size: 2.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    p {
      margin-bottom: 2rem;
      color: #888;
      font-size: 1.1rem;
    }
    
    #container {
      background: #000;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      border: 2px solid rgba(102, 126, 234, 0.3);
    }
    
    canvas {
      display: block;
      image-rendering: pixelated;
      background: #000;
      border-radius: 4px;
    }
    
    #status {
      margin-top: 1.5rem;
      padding: 1.5rem;
      background: rgba(42, 42, 42, 0.8);
      border-radius: 8px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 0.875rem;
      line-height: 1.8;
      max-width: 800px;
      border: 1px solid rgba(102, 126, 234, 0.2);
    }
    
    .status-line {
      color: #667eea;
      margin: 0.25rem 0;
    }
    
    .error {
      color: #ff6b6b;
      font-weight: bold;
    }
    
    .success {
      color: #51cf66;
      font-weight: bold;
    }
    
    .info {
      color: #4dabf7;
    }
  </style>
</head>
<body>
  <h1>🚀 TStorie JS</h1>
  <p>Rebuilt with SES + Modern Web APIs</p>
  
  <div id="container">
    <canvas id="canvas" width="800" height="480"></canvas>
  </div>
  
  <div id="status">
    <div class="status-line info">⏳ Initializing engine...</div>
  </div>

  <script type="module">
    // Direct inline code to avoid import issues
    const status = document.getElementById('status');
    
    function log(message, type = 'info') {
      const line = document.createElement('div');
      line.className = `status-line ${type}`;
      line.textContent = message;
      status.appendChild(line);
      status.scrollTop = status.scrollHeight;
    }

    // Simple markdown content
    const markdown = `
# Simple Test

## JavaScript Code

\`\`\`javascript
let x = 40;
let y = 12;
let vx = 1;
let vy = 0.5;
let frame = 0;
const trail = [];

function init() {
  console.log('🎮 Simple test initialized!');
}

function update(delta) {
  // Update position
  x += vx * delta * 60;
  y += vy * delta * 60;
  
  // Bounce off walls
  if (x <= 1 || x >= canvas.width() - 2) {
    vx = -vx;
    x = Math.max(1, Math.min(canvas.width() - 2, x));
  }
  
  if (y <= 1 || y >= canvas.height() - 2) {
    vy = -vy;
    y = Math.max(1, Math.min(canvas.height() - 2, y));
  }
  
  // Store trail
  trail.push({ x: Math.floor(x), y: Math.floor(y) });
  if (trail.length > 10) trail.shift();
  
  // Randomize on space
  if (key.pressed(key.SPACE)) {
    vx = (Math.random() - 0.5) * 3;
    vy = (Math.random() - 0.5) * 3;
  }
  
  frame++;
}

function render() {
  // Clear
  text.clear();
  
  // Draw border
  const borderColor = {r: 102, g: 126, b: 234};
  for (let i = 0; i < canvas.width(); i++) {
    canvas.plot(i, 0, '─', borderColor);
    canvas.plot(i, canvas.height() - 1, '─', borderColor);
  }
  for (let i = 0; i < canvas.height(); i++) {
    canvas.plot(0, i, '│', borderColor);
    canvas.plot(canvas.width() - 1, i, '│', borderColor);
  }
  
  // Corners
  canvas.plot(0, 0, '┌', borderColor);
  canvas.plot(canvas.width() - 1, 0, '┐', borderColor);
  canvas.plot(0, canvas.height() - 1, '└', borderColor);
  canvas.plot(canvas.width() - 1, canvas.height() - 1, '┘', borderColor);
  
  // Draw trail
  for (let i = 0; i < trail.length; i++) {
    const t = trail[i];
    const alpha = (i + 1) / trail.length;
    const c = Math.floor(255 * alpha);
    canvas.plot(t.x, t.y, '·', {r: c, g: c, b: 0});
  }
  
  // Draw character
  const ix = Math.floor(x);
  const iy = Math.floor(y);
  canvas.plot(ix, iy, '🚀', {r: 255, g: 255, b: 0});
  
  // Title
  const title = ' TStorie JS - SES Edition ';
  text.write(Math.floor(canvas.width() / 2 - title.length / 2), 0, 
    title, {r: 255, g: 255, b: 255}, {r: 102, g: 126, b: 234});
  
  // Stats
  text.write(2, 2, \`Frame: \${frame}\`, {r: 150, g: 150, b: 150});
  text.write(2, 3, \`FPS: \${Math.round(1 / getDelta())}\`, {r: 150, g: 150, b: 150});
  text.write(2, 4, \`Pos: (\${ix}, \${iy})\`, {r: 150, g: 150, b: 150});
  text.write(2, 5, \`Velocity: (\${vx.toFixed(2)}, \${vy.toFixed(2)})\`, {r: 150, g: 150, b: 150});
  
  // Instructions
  text.write(2, canvas.height() - 2, 
    '💡 Press SPACE to randomize velocity', 
    {r: 77, g: 171, b: 247});
}
\`\`\`
    `;

    async function main() {
      try {
        log('📦 Loading engine modules...', 'info');
        
        // Import the engine
        const { TStorieEngine } = await import('/src/main.ts');
        
        log('✓ Modules loaded', 'success');
        log('🔧 Creating engine...', 'info');
        
        // Get canvas
        const canvas = document.getElementById('canvas');
        
        // Create engine
        const engine = new TStorieEngine(canvas, {
          width: 80,
          height: 24,
          fontSize: 16
        });
        
        log('✓ Engine created', 'success');
        log('📄 Loading demo code...', 'info');
        
        // Load markdown demo
        const loaded = engine.loadMarkdown('test', markdown);
        
        if (!loaded) {
          log('✗ Failed to load demo', 'error');
          log('Check browser console for details', 'error');
          return;
        }
        
        log('✓ Demo loaded', 'success');
        log('▶️ Starting main loop...', 'info');
        
        // Start the engine
        engine.start();
        
        log('✓ Engine running!', 'success');
        log('', 'info');
        log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
        log('🎮 Controls:', 'success');
        log('  SPACE - Randomize velocity', 'info');
        log('', 'info');
        log('📊 Architecture:', 'info');
        log('  ✓ SES Compartments (sandboxed)', 'success');
        log('  ✓ Canvas 2D Renderer', 'success');
        log('  ✓ 60 FPS main loop', 'success');
        log('  ✓ Layer compositing', 'success');
        log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
        
      } catch (error) {
        log(`✗ Fatal Error: ${error.message}`, 'error');
        log(`Stack: ${error.stack}`, 'error');
        console.error('Full error:', error);
      }
    }

    // Start
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', main);
    } else {
      main();
    }
  </script>
</body>
</html>
