[package]
name = "storie"
version = "2.0.0"
description = "S|torie - Interactive story and game engine"
authors = ["MaddestLabs"]
license = "MIT"
repository = "https://github.com/maddestlabs/storie"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "storie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "storie"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"   # smaller binary
codegen-units = 1 # better optimisation
lto = true
opt-level = "s"   # optimise for size (good for portable)
strip = true
